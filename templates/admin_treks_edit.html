<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Trek</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
          <span class="fw-semibold">Trekking Management Application</span>
          <span class="text-muted">Admin</span>
        </div>

        <div class="card-body p-4">
          <h1 class="h4 mb-4">Edit Trek</h1>

          <form method="post" action="{{ url_for('controllers.admin_treks_edit', id=trek.id) }}">
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="trekName" class="form-label">Trek Name</label>
                  <input type="text" class="form-control" id="trekName" name="trek_name" value="{{ trek.trek_name }}" required>
                </div>
                <div class="mb-3">
                  <label for="location" class="form-label">Location</label>
                  <input type="text" class="form-control" id="location" name="location" value="{{ trek.location }}" required>
                </div>
                <div class="mb-3">
                  <label for="difficulty" class="form-label">Difficulty</label>
                  <select class="form-select" id="difficulty" name="difficulty" required>
                    <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                    <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                    <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="duration" class="form-label">Duration (Days)</label>
                  <input type="number" class="form-control" id="duration" name="duration" min="1" value="{{ trek.duration }}" required>
                </div>
                <div class="mb-3">
                  <label for="availableSlots" class="form-label">Available Slots</label>
                  <input type="number" class="form-control" id="availableSlots" name="available_slots" min="0" value="{{ trek.available_slots }}" required>
                </div>
              </div>

              <div class="col-md-6">
                <div class="mb-3">
                  <label for="startDate" class="form-label">Start Date</label>
                  <input type="date" class="form-control" id="startDate" name="start_date" value="{{ trek.start_date.strftime('%Y-%m-%d') if trek.start_date else '' }}">
                </div>
                <div class="mb-3">
                  <label for="endDate" class="form-label">End Date</label>
                  <input type="date" class="form-control" id="endDate" name="end_date" value="{{ trek.end_date.strftime('%Y-%m-%d') if trek.end_date else '' }}">
                </div>
                <div class="mb-3">
                  <label for="assignStaff" class="form-label">Assign Staff</label>
                  <select class="form-select" id="assignStaff" name="assign_staff">
                    <option value="" {% if not trek.assigned_staff_id %}selected{% endif %}>-- Select Staff --</option>
                    {% for staff in staff_list %}
                    <option value="{{ staff.id }}" {% if trek.assigned_staff_id == staff.id %}selected{% endif %}>{{ staff.name }}</option>
                    {% endfor %}
                  </select>
                </div>
                <div class="mb-3">
                  <label for="status" class="form-label">Status</label>
                  <select class="form-select" id="status" name="status" required>
                    <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open</option>
                    <option value="Closed" {% if trek.status == 'Closed' %}selected{% endif %}>Closed</option>
                    <option value="Started" {% if trek.status == 'Started' %}selected{% endif %}>Started</option>
                    <option value="Ongoing" {% if trek.status == 'Ongoing' %}selected{% endif %}>Ongoing</option>
                    <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="description" class="form-label">Description</label>
                  <textarea class="form-control" id="description" name="description" rows="4">{{ trek.description or '' }}</textarea>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-3">
              <a href="{{ url_for('controllers.admin_treks') }}" class="btn btn-outline-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
