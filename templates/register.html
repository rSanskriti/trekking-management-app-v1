{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<style>
    body {
        background-color: #e39d68;
    }

    .card {
        border: 1px solid #C9B79C;
        border-radius: 10px;
        background-color: #aef6a2;
    }

    .card h2 {
        color: #3F6B4F;
        font-weight: 600;
    }

    .form-label {
        color: #6B4A2E;
        font-weight: 500;
    }

    .form-control,
    .form-select {
        border: 1px solid #C9B79C;
        border-radius: 6px;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #3F6B4F;
        box-shadow: 0 0 0 0.2rem rgba(63, 107, 79, 0.2);
    }

    .btn-primary {
        background-color: #3F6B4F;
        border-color: #3F6B4F;
    }

    .btn-primary:hover,
    .btn-primary:focus {
        background-color: #2E5139;
        border-color: #2E5139;
    }

    a {
        color: #6B4A2E;
    }

    a:hover {
        color: #3F6B4F;
    }
</style>
<div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-7 col-lg-6">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <h2 class="mb-4 h4">Register</h2>
                <form method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name">
                    </div>
                    <div class="mb-3">
                        <label for="contact_details" class="form-label">Contact Details</label>
                        <input type="text" class="form-control" id="contact_details" name="contact_details">
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">Role</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="Trekker">Trekker</option>
                            <option value="Trek Staff">Trek Staff</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                    <p class="mt-3 text-center mb-0"><a href="{{ url_for('controllers.login') }}">Already have an account? Login</a></p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
