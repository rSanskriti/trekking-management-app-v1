<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trekker Accounts</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  </head>
  <body>
    <div class="container-fluid d-flex">
      <div class="bg-dark text-white p-3 min-vh-100" style="width: 250px;">
        <h2 class="h5 text-uppercase">Admin Panel</h2>
        <nav class="nav flex-column mt-4">
          <a class="nav-link text-white" href="{{ url_for('controllers.admin_treks') }}">Manage Treks</a>
          <a class="nav-link text-white" href="{{ url_for('controllers.admin_staff') }}">Manage Staff</a>
          <a class="nav-link text-white active" href="{{ url_for('controllers.admin_users') }}">View Users</a>
          <a class="nav-link text-white" href="{{ url_for('controllers.admin_bookings') }}">View Bookings</a>
          <a class="nav-link text-white" href="{{ url_for('controllers.logout') }}">Logout</a>
        </nav>
      </div>

      <div class="flex-grow-1 p-4 bg-light">
        <header>
          <h2>Trekker Accounts</h2>
        </header>

        <section class="mt-4">
          <form method="get" action="{{ url_for('controllers.admin_users') }}" class="d-flex gap-2 align-items-center">
            <input type="text" class="form-control" name="q" placeholder="Search by username" value="{{ q }}">
            <button type="submit" class="btn btn-outline-primary">Search</button>
          </form>
        </section>

        <section class="mt-3">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>User ID</th>
                  <th>Username</th>
                  <th>Account Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {% for user in users %}
                <tr>
                  <td>{{ user.id }}</td>
                  <td>{{ user.username }}</td>
                  <td>{{ user.role }}</td>
                  <td>
                    <form method="post" action="{{ url_for('controllers.admin_users') }}" class="d-inline me-1">
                      <input type="hidden" name="user_id" value="{{ user.id }}">
                      <input type="hidden" name="action" value="toggle">
                      <button type="submit" class="btn btn-sm btn-secondary">Toggle</button>
                    </form>
                    <form method="post" action="{{ url_for('controllers.admin_users') }}" class="d-inline">
                      <input type="hidden" name="user_id" value="{{ user.id }}">
                      <input type="hidden" name="action" value="block">
                      <input type="hidden" name="role" value="Blocked">
                      <button type="submit" class="btn btn-sm btn-danger">Blacklist</button>
                    </form>
                  </td>
                </tr>
                {% else %}
                <tr>
                  <td colspan="4" class="text-center text-muted">No user accounts found.</td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
