<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add New Trek</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
          <span class="fw-semibold">Trekking Management Application</span>
          <span class="text-muted">Admin</span>
        </div>

        <div class="card-body p-4">
          <h1 class="h4 mb-4">Add New Trek</h1>

          <form method="post" action="{{ url_for('controllers.admin_treks_add') }}">
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="trekName" class="form-label">Trek Name</label>
                  <input type="text" class="form-control" id="trekName" name="trek_name" required>
                </div>
                <div class="mb-3">
                  <label for="location" class="form-label">Location</label>
                  <input type="text" class="form-control" id="location" name="location" required>
                </div>
                <div class="mb-3">
                  <label for="difficulty" class="form-label">Difficulty</label>
                  <select class="form-select" id="difficulty" name="difficulty" required>
                    <option value="" selected disabled>-- Select --</option>
                    <option value="Easy">Easy</option>
                    <option value="Moderate">Moderate</option>
                    <option value="Hard">Hard</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="duration" class="form-label">Duration (Days)</label>
                  <input type="number" class="form-control" id="duration" name="duration" min="1" required>
                </div>
                <div class="mb-3">
                  <label for="availableSlots" class="form-label">Available Slots</label>
                  <input type="number" class="form-control" id="availableSlots" name="available_slots" min="1" required>
                </div>
              </div>

              <div class="col-md-6">
                <div class="mb-3">
                  <label for="startDate" class="form-label">Start Date</label>
                  <input type="date" class="form-control" id="startDate" name="start_date" required>
                </div>
                <div class="mb-3">
                  <label for="endDate" class="form-label">End Date</label>
                  <input type="date" class="form-control" id="endDate" name="end_date" required>
                </div>
                <div class="mb-3">
                  <label for="assignStaff" class="form-label">Assign Staff</label>
                  <select class="form-select" id="assignStaff" name="assign_staff" required>
                    <option value="" selected disabled>-- Select Staff --</option>
                    {% for staff in staff_list %}
                    <option value="{{ staff.id }}">{{ staff.name }}</option>
                    {% endfor %}
                  </select>
                </div>
                <div class="mb-3">
                  <label for="status" class="form-label">Status</label>
                  <select class="form-select" id="status" name="status" required>
                    <option value="" selected disabled>-- Select Status --</option>
                    <option value="Open">Open</option>
                    <option value="Closed">Closed</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="description" class="form-label">Description</label>
                  <textarea class="form-control" id="description" name="description" rows="4"></textarea>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-3">
              <a href="{{ url_for('controllers.admin_treks') }}" class="btn btn-outline-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
